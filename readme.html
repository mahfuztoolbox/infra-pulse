<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infra Pulse — README</title>
  <meta name="description" content="Infra Pulse project README as a static page." />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --dim: #6e7681;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --code: #0d1117;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.1rem;
      background: #010409;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .bar strong { color: var(--accent); }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; }
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.6rem 2rem;
    }
    #content h1 {
      margin: 0 0 0.75rem;
      font-size: 1.85rem;
      color: var(--accent);
    }
    #content h2 {
      margin: 1.6rem 0 0.65rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      font-size: 1.25rem;
    }
    #content h3 { margin: 1.1rem 0 0.45rem; font-size: 1.05rem; }
    #content p, #content li { color: #d0d7de; }
    #content blockquote {
      margin: 0.9rem 0;
      padding: 0.65rem 0.9rem;
      border-left: 3px solid var(--accent);
      background: #21262d;
      color: var(--muted);
      border-radius: 0 8px 8px 0;
    }
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.85rem 0 1rem;
      font-size: 0.92rem;
    }
    #content th, #content td {
      border: 1px solid var(--border);
      padding: 0.55rem 0.7rem;
      text-align: left;
    }
    #content th { background: #21262d; color: var(--muted); }
    #content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 0.5rem 0;
    }
    #content code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: #21262d;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    #content pre {
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      overflow: auto;
    }
    #content pre code { background: transparent; padding: 0; }
    #content hr { border: 0; border-top: 1px solid var(--border); margin: 1.4rem 0; }
    .err { color: #f85149; }
    .loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <div><strong>Infra Pulse</strong> — README (static page)</div>
    <div class="links">
      <a href="index.html">UI preview</a>
      <a href="images/architecture.png">Architecture</a>
      <a href="https://github.com/mahfuztoolbox/infra-pulse">GitHub repo</a>
    </div>
  </div>
  <div class="wrap">
    <div class="card">
      <div id="content" class="loading">Loading README.md…</div>
    </div>
  </div>
  <script>
    (async () => {
      const el = document.getElementById("content");
      try {
        const res = await fetch("README.md", { cache: "no-cache" });
        if (!res.ok) throw new Error("Could not load README.md (" + res.status + ")");
        const md = await res.text();
        marked.setOptions({ breaks: true });
        el.classList.remove("loading");
        el.innerHTML = marked.parse(md);
      } catch (e) {
        el.className = "err";
        el.textContent = String(e.message || e) +
          ". Tip: open via a local server or GitHub Pages (not as a raw file:// page).";
      }
    })();
  </script>
</body>
</html>
